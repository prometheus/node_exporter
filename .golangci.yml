version: "2"
linters:
  enable:
    - depguard
    - misspell
    - modernize
    - revive
  settings:
    depguard:
      rules:
        no_exec_policy:
          files:
            - '!$test'
          deny:
            - pkg: os/exec
              desc: Using os/exec to run sub processes it not allowed by policy
    errcheck:
      # Used in HTTP handlers, any error is handled by the server itself.
      exclude-functions:
        - (net/http.ResponseWriter).Write
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test.go
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/prometheus/node_exporter
